# Netlify-Konfiguration Bücherei Münzbach
# Statische Seite ohne Framework. Der Build kopiert nur die auszuliefernden Dateien nach dist/,
# damit _archiv, tools, content und README nicht öffentlich erreichbar sind.

[build]
  command = "rm -rf dist && mkdir dist && cp -r *.html *.png robots.txt sitemap.xml assets images downloads dist/"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Kontaktformular: main.js schickt an /api/kontakt – intern an die Netlify-Funktion weiterleiten
[[redirects]]
  from = "/api/kontakt"
  to = "/.netlify/functions/kontakt"
  status = 200
  force = true

# Alte .html-Adressen auf saubere URLs umleiten
[[redirects]]
  from = "/:page.html"
  to = "/:page"
  status = 301

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
